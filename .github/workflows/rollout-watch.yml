name: Rollout watch

# Did the FRONTEND actually ship?
#
# App Hosting builds the Next.js app on its own trigger — the backend
# `childbooks` watches `main` (`rolloutPolicy.codebaseBranch`) and starts a build
# seconds after every push, outside this repo's pipeline. Nothing in `ci.yml` or
# `deploy.yml` can see the result, so a rejected `apphosting.yaml` or a failed
# build leaves the live site serving the PREVIOUS release while every GitHub
# check stays green. That exact failure went unnoticed for a day and six pushes
# (2026-07-29 → 07-30) because "Deploy: success" says nothing about the frontend.
#
# This job waits for the build of THIS commit and pings Slack if it doesn't go
# live. It runs in parallel with everything else, so it adds no time to any other
# workflow — it just keeps running after they've finished.
#
# Reads only. No extra IAM: GCP_DEPLOY_SA already holds `roles/firebase.admin`,
# which includes `firebaseapphosting.builds.list`/`.get`. If that ever stops being
# true the job says "couldn't verify" instead of claiming the site is broken.
#
# ── Second half: "what's new" release notes ──────────────────────────────────
# Once the build IS live, the steps at the bottom summarise what shipped for the
# sales/marketing team (#releases). This workflow is the right home for it
# because it knows the one thing nobody else does: that users can now actually
# see this commit.
#
# The range runs from the last commit the backend SUMMARIZED (not the last one
# that went live) up to this one, so nothing is ever dropped: whenever a release
# posts nothing — failed frontend build, failed backend deploy, provider or Slack
# outage — its commits are simply carried into the next release's summary. See
# "Decide where the release notes start" below.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notes_from:
        description: "Release notes: summarize from this commit instead of the previously-live one (for prompt iteration)."
        required: false
        type: string
      notes_force:
        description: "Release notes: repost even if this commit was already summarized."
        required: false
        type: boolean
        default: false

concurrency:
  group: rollout-watch-${{ github.sha }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for Workload Identity Federation
      contents: read
      actions: read # read the Deploy run's conclusion for this commit
    env:
      API: https://firebaseapphosting.googleapis.com/v1beta/projects/childbook-60f89/locations/us-east4/backends/childbooks
      SLACK_CI_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
      BACKEND_URL: https://us-central1-childbook-60f89.cloudfunctions.net/api
      RELEASE_NOTES_TOKEN: ${{ secrets.RELEASE_NOTES_TOKEN }}
    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
          token_format: access_token # exposes steps.auth.outputs.access_token

      # Builds carry the commit (`source.codebase.hash`), so this tracks OUR commit
      # instead of "the newest build" — no guessing by timestamp, and a concurrent
      # push can't make us report on the wrong one.
      #
      # Note the states: a live BUILD is READY (it's the ROLLOUT that reports
      # SUCCEEDED), and an invalid apphosting.yaml lands in FAILED after ~40s,
      # while a genuine build takes ~5min.
      - name: Wait for the App Hosting build of this commit
        id: build
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -uo pipefail
          for _ in $(seq 1 44); do
            code=$(curl -sS -o /tmp/builds.json -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" "$API/builds?pageSize=100" || echo 000)

            # No permission to look is a SETUP problem, not a deploy failure —
            # say so plainly instead of raising a false alarm about the site.
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "verdict=unverified" >> "$GITHUB_OUTPUT"
              echo "::warning::Cannot read App Hosting builds (HTTP $code). Grant roles/firebaseapphosting.viewer to the deploy service account."
              exit 0
            fi
            if [ "$code" != "200" ]; then echo "transient HTTP $code"; sleep 15; continue; fi

            build=$(jq -c --arg sha "$GITHUB_SHA" \
              '[.builds[]? | select(.source.codebase.hash == $sha)] | sort_by(.createTime) | last // {}' \
              /tmp/builds.json)
            state=$(jq -r '.state // "PENDING"' <<<"$build")
            echo "build state: $state"

            case "$state" in
              READY)
                echo "verdict=live" >> "$GITHUB_OUTPUT"
                echo "Frontend build is live."
                exit 0;;
              FAILED)
                reason=$(jq -r '.error.message // "unknown"' <<<"$build" | tr -d '\r' | tr '\n' ' ')
                echo "reason=$reason" >> "$GITHUB_OUTPUT"
                echo "logs=$(jq -r '.buildLogsUri // ""' <<<"$build")" >> "$GITHUB_OUTPUT"
                echo "::error::App Hosting build FAILED — $reason"
                exit 1;;
            esac
            sleep 15
          done
          echo "reason=timed out after 11min waiting for the build to finish" >> "$GITHUB_OUTPUT"
          echo "::error::Timed out waiting for the App Hosting build."
          exit 1

      # ── "What's new" release notes (#releases) ──────────────────────────────
      # Best-effort throughout: every step below is `continue-on-error`, and the
      # alarm at the bottom is scoped to the build step, so nothing here can make
      # a healthy deploy look broken. Skipped entirely when the token is unset.

      # fetch-depth: 0 — the default shallow clone has no history to diff, and
      # the range resolution below needs to check whether a commit still exists.
      - name: Check out full history
        id: checkout
        if: steps.build.outputs.verdict == 'live' && env.RELEASE_NOTES_TOKEN != ''
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # WHERE THE RANGE STARTS. Two sources, in order of trust:
      #
      #   1. The marker — the last commit the backend actually SUMMARIZED. This is
      #      what makes nothing get lost: a release skipped for any reason (failed
      #      backend deploy, provider outage, Slack outage, nothing confident to
      #      say) leaves the marker where it was, so this range simply widens to
      #      cover it. See `advanceState` in functions/src/releaseNotes.ts.
      #   2. If there is no marker yet (first run, or every attempt so far 500'd),
      #      the last 25 commits. We do NOT use "the previous live build" here:
      #      `A..B` excludes A, so a commit that went live and then failed to
      #      summarize would vanish the moment it became "last live".
      - name: Decide where the release notes start
        id: range
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          OVERRIDE: ${{ inputs.notes_from }}
        run: |
          set -uo pipefail
          in_history() { git cat-file -e "${1}^{commit}" 2>/dev/null; }
          emit() { echo "sha=$1" >> "$GITHUB_OUTPUT"; echo "Range starts at $1 (source: $2)"; }

          if [ -n "${OVERRIDE:-}" ]; then
            emit "$OVERRIDE" "manual run input"
            exit 0
          fi

          marker=$(curl -fsS --max-time 30 \
            -H "Authorization: Bearer $RELEASE_NOTES_TOKEN" \
            "$BACKEND_URL/internal/release-notes/state" 2>/dev/null \
            | jq -r '.lastSummarizedSha // ""' 2>/dev/null || echo "")

          if [ -n "$marker" ] && [ "$marker" != "null" ] && in_history "$marker"; then
            if [ "$marker" = "$GITHUB_SHA" ]; then
              echo "::notice::This commit was already summarized — nothing to do."
              exit 0
            fi
            emit "$marker" "last summarized commit"
            exit 0
          fi
          [ -n "$marker" ] && [ "$marker" != "null" ] \
            && echo "Marker $marker is not in this repo's history — falling back."

          # No marker yet (first run, or every attempt so far failed). `A..B`
          # excludes A, so "last live build" as A would drop a commit that went
          # live but was never summarized — which is exactly the hole the marker
          # exists to close. Walk back up to 25 commits so a failed first post
          # is still in the next range.
          start=$(git rev-list --max-count=26 "$GITHUB_SHA" | tail -n 1)
          if [ -n "$start" ] && [ "$start" != "$GITHUB_SHA" ] && in_history "$start"; then
            emit "$start" "no marker yet — last 25 commits"
            exit 0
          fi
          echo "::notice::No usable starting commit — skipping release notes."

      # A green frontend says nothing about the backend, which deploys in
      # parallel (deploy.yml). The release-notes endpoint lives on THAT
      # deploy, so posting while it is still in progress hits the previous
      # revision and 500s. Wait until it succeeds; if it failed, stay quiet
      # (the marker doesn't move, so the next release covers these commits).
      - name: Wait for the backend deploy of this commit
        id: backend
        if: steps.range.outputs.sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for _ in $(seq 1 40); do
            run=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=50" \
              --jq '[.workflow_runs[]? | select(.name=="Deploy")] | sort_by(.created_at) | last // {}' \
              2>/dev/null || echo '{}')
            status=$(jq -r '.status // ""' <<<"$run")
            conclusion=$(jq -r '.conclusion // ""' <<<"$run")
            echo "backend deploy: status=${status:-?} conclusion=${conclusion:-?}"
            if [ "$conclusion" = "success" ]; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ]; then
              echo "::notice::Backend deploy did not succeed ($conclusion) — skipping release notes."
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "::notice::Timed out waiting for the backend deploy — skipping release notes."
          echo "ok=false" >> "$GITHUB_OUTPUT"

      # Collect the range and POST it. The backend picks the model and prompt
      # (admin dashboard → Configuration → AI pipeline), decides whether anything
      # here is worth telling anyone about, posts to Slack, and moves the marker —
      # see functions/src/releaseNotes.ts.
      - name: Summarize the release to Slack
        id: notes
        if: steps.range.outputs.sha != '' && steps.backend.outputs.ok == 'true'
        continue-on-error: true
        env:
          PREV: ${{ steps.range.outputs.sha }}
          FORCE: ${{ inputs.notes_force }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # Both resolved sources are checked already; this catches a typo in the
          # commit given on a manual run, which is passed through unvalidated.
          if ! git cat-file -e "${PREV}^{commit}" 2>/dev/null; then
            echo "::notice::$PREV is not in this repo's history — skipping release notes."
            exit 0
          fi

          # Excluded on purpose: lockfiles and tsconfig.tsbuildinfo churn on
          # every build and would drown the real changes, and nothing about them
          # is ever user-visible.
          EXCLUDES=(
            ':(exclude)yarn.lock'
            ':(exclude)package-lock.json'
            ':(exclude)**/tsconfig.tsbuildinfo'
            ':(exclude)**/*.snap'
            ':(exclude)**/*.svg'
            ':(exclude)**/*.png'
            ':(exclude)**/*.jpg'
            ':(exclude)**/*.webp'
            ':(exclude)**/*.ico'
            ':(exclude)**/*.woff'
            ':(exclude)**/*.woff2'
          )

          range="${PREV}..${GITHUB_SHA}"
          count=$(git rev-list --count "$range")
          # Truncate on LINE boundaries, not bytes: `head -c` can cut mid-character
          # and jq rejects invalid UTF-8, which would turn a large release into an
          # empty payload. Diffs are line-oriented anyway.
          clip() { awk -v max="$1" '{ n += length($0) + 1; if (n > max) exit; print }'; }
          # Write blobs to files and let jq --rawfile read them. `--arg` puts the
          # value on argv, and Linux rejects a single argument over 128KB
          # (MAX_ARG_STRLEN) — a 400KB clipped diff then dies as
          # "jq: Argument list too long" before Slack ever hears about the release.
          # Squash-merged PRs: title in the subject, description in the body.
          git log --no-merges --format='- %s%n%b' "$range" | clip 40000 > /tmp/commit-log.txt
          git diff --stat "$range" -- . "${EXCLUDES[@]}" | clip 40000 > /tmp/diff-stat.txt
          git diff --unified=3 "$range" -- . "${EXCLUDES[@]}" | clip 400000 > /tmp/diff.txt

          if [ ! -s /tmp/commit-log.txt ] && [ ! -s /tmp/diff.txt ]; then
            echo "Nothing to summarize."
            exit 0
          fi

          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg previousSha "$PREV" \
            --arg runUrl "$RUN_URL" \
            --argjson commitCount "${count:-0}" \
            --rawfile commitLog /tmp/commit-log.txt \
            --rawfile diffStat /tmp/diff-stat.txt \
            --rawfile diff /tmp/diff.txt \
            --argjson force "$([ "${FORCE:-false}" = "true" ] && echo true || echo false)" \
            '$ARGS.named' > /tmp/payload.json

          # A timeout here loses the RESPONSE, not the work: the function posts to
          # Slack and moves the marker before it answers, so a slow model shows up
          # as a red step next to a delivered message rather than a repeat next run.
          #
          # Don't use curl -f: a 500 then hides the JSON body, which is the only
          # clue (`maxLength` rejected, token mismatch, model missing, …).
          echo "Summarizing $count commit(s): $PREV..$GITHUB_SHA ($(wc -c < /tmp/payload.json) bytes)"
          code=$(curl -sS --max-time 300 \
            -o /tmp/notes.json -w '%{http_code}' \
            -X POST "$BACKEND_URL/internal/release-notes" \
            -H "Authorization: Bearer $RELEASE_NOTES_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/payload.json)
          cat /tmp/notes.json
          echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Release notes endpoint returned HTTP $code"
            exit 1
          fi

      # Only fires when the frontend did NOT go live. Success is silent: the whole
      # point is that a stale site stops being invisible, not more green noise.
      # Scoped to the BUILD step on purpose — a failure in the release-notes
      # steps above must never claim the site is broken.
      - name: Notify Slack (frontend did not deploy)
        if: failure() && steps.build.outcome == 'failure' && env.SLACK_CI_WEBHOOK_URL != ''
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REASON: ${{ steps.build.outputs.reason }}
          LOGS: ${{ steps.build.outputs.logs }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          text="🚨 FRONTEND DID NOT DEPLOY — ${GITHUB_REPOSITORY}@${GITHUB_SHA:0:7}
          The live site is still serving the previous build.
          ${COMMIT_MSG%%$'\n'*}
          ${REASON:-see the run log}
          ${LOGS:+Build logs: $LOGS}
          by ${GITHUB_ACTOR} · ${RUN_URL}"
          payload=$(printf '{"text": %s}' "$(printf '%s' "$text" | jq -Rs .)")
          curl -fsS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_CI_WEBHOOK_URL"
