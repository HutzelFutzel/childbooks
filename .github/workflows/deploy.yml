name: Deploy

# BACKEND deploy pipeline for a push to `main`:
#
#   build functions  →  full env/secret check  →  deploy backend  →  health check
#
# What deploys where — these are two INDEPENDENT pipelines:
#   - BACKEND  (this workflow): the `api` Cloud Function (+ scheduled/trigger
#     functions), Firestore rules + indexes, and Storage rules. Firebase skips
#     functions whose code is unchanged, so running on every push is cheap.
#   - FRONTEND (Firebase App Hosting): the backend `childbooks` watches `main`
#     itself (`rolloutPolicy.codebaseBranch`) and starts building seconds after
#     a push, in parallel with this workflow. It is NOT gated on anything here,
#     so a green run below says nothing about the frontend — that's what
#     `rollout-watch.yml` is for. This workflow therefore does not typecheck or
#     build the frontend either; `ci.yml` does that on the same push.
#
# ── One-time setup (see the repo README / the summary in chat) ──────────────
#   Repo secrets (Settings → Secrets and variables → Actions):
#     GCP_WIF_PROVIDER  — Workload Identity Federation provider resource name
#     GCP_DEPLOY_SA     — deploy service account email. Roles: Cloud Functions
#                         Admin, Cloud Run Admin, Service Account User, Firebase
#                         Rules Admin, Cloud Datastore Index Admin, and Secret
#                         Manager Secret Accessor (for check-env + secret
#                         binding). `roles/firebase.admin` also covers the
#                         App Hosting reads `rollout-watch.yml` needs.
#     SLACK_CI_WEBHOOK_URL — (optional) Slack incoming webhook (#ci-cd) for
#                         deploy start/result pings. If unset, GitHub's built-in
#                         email/mobile notifications for failed runs still apply.
#   Branch protection on `main`: require the CI checks to pass before merge.
#     This is the ONLY thing standing between a bad commit and the live site,
#     since App Hosting rolls out `main` regardless of what happens here.
#
# Secrets (OpenAI/Gemini/Lulu/Stripe keys) are NOT set here — set them once with
# `yarn setSecrets` / `firebase functions:secrets:set`. A deploy binds the latest
# versions; `check-env` fails the run if a required one is missing.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual runs

concurrency:
  group: deploy-main
  cancel-in-progress: false # never interrupt an in-flight deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    env:
      PROJECT_ID: childbook-60f89
      BACKEND_URL: https://us-central1-childbook-60f89.cloudfunctions.net/api
      SLACK_CI_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      # Ping Slack (#ci-cd) as soon as a deploy kicks off — the matching result
      # ping ("Notify Slack (deploy result)") posts at the end. Two independent
      # messages (start + end), since an incoming webhook can't edit/thread.
      - name: Notify Slack (deploy started)
        if: env.SLACK_CI_WEBHOOK_URL != ''
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          # `commits` lists every commit in this push (oldest first, capped at
          # 20 by GitHub). It's null/absent on a manual `workflow_dispatch`
          # run, which is why COMMIT_MSG above stays as a fallback.
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          commits=$(printf '%s' "$COMMITS_JSON" | jq -r '
            if type == "array" and length > 0
            then .[] | "• `" + .id[0:7] + "` " + (.message | split("\n")[0])
            else "" end')
          if [ -z "$commits" ]; then
            commits="• ${COMMIT_MSG%%$'\n'*}"
          fi
          text="⏳ Deploy started — ${GITHUB_REPOSITORY}@${GITHUB_SHA:0:7}
          ${commits}
          by ${GITHUB_ACTOR} · ${RUN_URL}"
          payload=$(printf '{"text": %s}' "$(printf '%s' "$text" | jq -Rs .)")
          curl -fsS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_CI_WEBHOOK_URL"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # ── Gate: it must build before anything is deployed ────────────────────
      # Frontend typecheck/build live in `ci.yml`, which runs on this same push
      # in parallel. Repeating them here would only delay the backend deploy —
      # the frontend rollout doesn't wait for this workflow either way.
      - name: Build functions
        id: build_functions
        run: yarn build:functions

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      # ── Gate: config is actually deployable ────────────────────────────────
      # apphosting.yaml frontend vars + every declared secret exists in Secret
      # Manager + PUBLIC_APP_URL is set (checkout would 500 without it). Runs
      # after auth so the Secret Manager lookups work; fails BEFORE any deploy.
      - name: Check environment
        id: checkenv
        run: node scripts/check-env.mjs

      - name: Deploy backend (functions, rules, indexes, storage)
        id: deploy
        run: >-
          yarn firebase deploy
          --only functions,firestore:rules,firestore:indexes,storage
          --project "$PROJECT_ID"
          --non-interactive

      # ── Gate: it actually came up ──────────────────────────────────────────
      - name: Health check
        id: health
        run: |
          set -euo pipefail
          for path in /health /providers; do
            echo "→ GET $BACKEND_URL$path"
            curl -fsS --max-time 20 "$BACKEND_URL$path" > /dev/null
          done
          echo "Backend is up."

      # Report the outcome to Slack (#ci-cd) on SUCCESS and FAILURE. Runs always
      # so a failure at any step above still pings; skipped only when no webhook
      # is configured (GitHub's own failed-run emails still cover you).
      - name: Notify Slack (deploy result)
        if: always() && env.SLACK_CI_WEBHOOK_URL != ''
        env:
          STATUS: ${{ job.status }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Name the first step that failed (for a helpful message).
          failed=""
          for entry in \
            "build functions:${{ steps.build_functions.outcome }}" \
            "google auth:${{ steps.auth.outcome }}" \
            "env check:${{ steps.checkenv.outcome }}" \
            "deploy backend:${{ steps.deploy.outcome }}" \
            "health check:${{ steps.health.outcome }}"; do
            name="${entry%%:*}"; outcome="${entry##*:}"
            if [ "$outcome" = "failure" ]; then failed="$name"; break; fi
          done

          case "$STATUS" in
            success)   emoji="✅"; detail="Backend deployed (frontend rolls out separately — see Rollout watch)";;
            cancelled) emoji="⚠️"; detail="Run cancelled";;
            *)         emoji="❌"; detail="Failed at *${failed:-unknown step}* — open the logs";;
          esac

          commits=$(printf '%s' "$COMMITS_JSON" | jq -r '
            if type == "array" and length > 0
            then .[] | "• `" + .id[0:7] + "` " + (.message | split("\n")[0])
            else "" end')
          if [ -z "$commits" ]; then
            commits="• ${COMMIT_MSG%%$'\n'*}"
          fi

          text="$emoji Deploy *$STATUS* — ${GITHUB_REPOSITORY}@${GITHUB_SHA:0:7}
          ${detail}
          ${commits}
          by ${GITHUB_ACTOR} · ${RUN_URL}"
          payload=$(printf '{"text": %s}' "$(printf '%s' "$text" | jq -Rs .)")
          curl -fsS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_CI_WEBHOOK_URL"
