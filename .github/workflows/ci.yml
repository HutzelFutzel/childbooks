name: CI

# The PR gate: verify the whole monorepo builds, typechecks, and is
# configuration-sane before code can reach `main`. Make these required status
# checks in branch protection so nothing merges red — this is the ONLY gate on
# the live site, because App Hosting builds and rolls out `main` on its own
# trigger seconds after a push, without waiting for any workflow here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SLACK_CI_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Frontend type safety (Next is built below; this catches type errors the
      # build's transpile-only step would otherwise miss).
      - name: Typecheck frontend
        run: yarn workspace books-frontend typecheck

      # esbuild (below) strips types without checking them, so the backend needs
      # its own tsc pass — otherwise a type error in a function, or in the shared
      # core modules it imports, bundles cleanly and fails in production.
      - name: Typecheck functions
        run: yarn workspace functions typecheck

      # Backend bundle (esbuild via the functions workspace build script).
      - name: Build functions
        run: yarn build:functions

      # Pricing properties that typechecking can't see: margins that hold at one
      # page count and collapse at another, shipping fallbacks that don't scale
      # with copies, a seeded product whose only shipping tier isn't sold to our
      # biggest markets. Offline — no provider credentials, no network.
      - name: Check pricing invariants
        run: yarn check:pricing

      # Print properties that typechecking can't see either, and that produce a
      # perfectly valid PDF when they're wrong: a page declared at one size and
      # drawn at another, a spread that never gets split into two leaves, an
      # interior short of the page count the order was priced and bound at.
      - name: Check print geometry invariants
        run: yarn check:print-geometry

      - name: Check geo inference invariants
        run: yarn check:geo

      # App Hosting applies apphosting.yaml's env when it builds; a bare
      # `yarn build:web` here would not, and NEXT_PUBLIC_* are inlined at build
      # time. Load them so this really is the same build production gets.
      - name: Load frontend build env (apphosting.yaml)
        run: node scripts/apphosting-env.mjs >> "$GITHUB_ENV"

      # Production build of the Next.js app (same build App Hosting runs).
      - name: Build web
        run: yarn build:web

      # Config-only deployability check (no cloud auth): apphosting.yaml declares
      # every NEXT_PUBLIC_* the frontend build inlines, and emulators are off.
      # The full check (Secret Manager + PUBLIC_APP_URL) runs in the Deploy
      # workflow after Google auth.
      - name: Check environment (config only)
        run: node scripts/check-env.mjs --no-secrets

      # Ping Slack (#ci-cd) only when CI fails on `main` (a red PR is the author's
      # problem; a red `main` is everyone's). Skipped when no webhook is configured.
      - name: Notify Slack on failure
        if: failure() && github.ref == 'refs/heads/main' && env.SLACK_CI_WEBHOOK_URL != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          text="❌ CI failed on *main* — ${GITHUB_REPOSITORY}@${GITHUB_SHA:0:7}
          by ${GITHUB_ACTOR} · ${RUN_URL}"
          payload=$(printf '{"text": %s}' "$(printf '%s' "$text" | jq -Rs .)")
          curl -fsS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_CI_WEBHOOK_URL"
